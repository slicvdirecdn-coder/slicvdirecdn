<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
body{
    margin:0;
    background:#000;
}

video{
    width:100%;
    height:100vh;
    object-fit:contain;
    background:#000;
}

#title{
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-size:14px;
}
</style>
</head>

<body>

<video
id="player"
controls
playsinline
controlsList="nodownload">

<source src="" type="video/mp4">
</video>

<script>

/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SMART LINK ADSTERRA */
const DIRECT_LINK =
"https://acidic-deal.com/4WQ7LM";

const video = document.getElementById("player");

let clicked = false;


/* =========================
   REDIRECT IKLAN
========================= */

function redirectRandom(){

    if(clicked) return;

    clicked = true;

    window.open(DIRECT_LINK, "_blank");

}


/* =========================
   AMBIL ID VIDEO DINAMIS
========================= */

const hash = window.location.hash;

const id = decodeURIComponent(
    hash.replace(/^#\/?/, '')
);


/* =========================
   LOAD VIDEOS.JSON
========================= */

fetch(JSON_URL)

.then(res => {

    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }

    return res.json();

})

.then(data => {

    const vids = data.videos;

    const selected = id
        ? vids.find(v => v.id === id)
        : null;

    const finalVideo = selected || vids[0];

    if(!finalVideo){

        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';

        return;
    }

    video.src = finalVideo.cdn;

})

.catch(error => {

    console.error(error);

    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

});


/* =========================
   IKLAN KLIK PERTAMA
========================= */

video.addEventListener("click", function(){

    if(!clicked){

        redirectRandom();

    }

});

</script>

</body>
</html>
