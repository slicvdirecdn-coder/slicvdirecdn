
<script>

/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

const DIRECT_LINK =
"https://s.shopee.co.id/7AeWeeLqUU";

const video = document.getElementById("player");

let redirectDone = false;


/* =========================
   AUTO REDIRECT 30 DETIK
========================= */

setTimeout(function(){

    if(redirectDone) return;

    redirectDone = true;

    window.location.href = DIRECT_LINK;

}, 30000);


/* =========================
   AMBIL ID VIDEO DINAMIS
========================= */

const hash = window.location.hash;

const id = decodeURIComponent(
    hash.replace(/^#\/?/, '')
);


/* =========================
   LOAD VIDEOS.JSON
========================= */

fetch(JSON_URL)

.then(res => {

    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }

    return res.json();

})

.then(data => {

    const vids = data.videos;

    const selected = id
        ? vids.find(v => v.id === id)
        : vids[0];

    if(!selected){

        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';

        return;
    }

    video.src = selected.cdn;

})

.catch(error => {

    console.error(error);

    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

});

</script>
