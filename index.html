<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
body{ margin:0; background:#000; }
video{ width:100%; height:100vh; object-fit:contain; background:#000; }
</style>
</head>

<body>

<video id="player" controls playsinline controlsList="nodownload"></video>

<script>
const JSON_URL = "videos.json";
const DIRECT_LINK = "https://acidic-deal.com/4WQ7LM";

const video = document.getElementById("player");
let adShown = false;

function openAd(){
  if(adShown) return;
  adShown = true;
  window.open(DIRECT_LINK, "_blank");
}

// AMBIL ID DARI # 
const id = decodeURIComponent(window.location.hash.replace(/^#\/?/, ''));

// LOAD VIDEO
fetch(JSON_URL)
  .then(res => {
    if(!res.ok) throw new Error("Gagal load videos.json");
    return res.json();
  })
  .then(data => {
    const vids = data.videos;
    const selected = id ? vids.find(v => v.id === id || v.name === id) : null;
    const finalVideo = selected || vids[0];
    if(!finalVideo){
      document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';
      return;
    }
    video.src = finalVideo.cdn;
  })
  .catch(err => {
    console.error(err);
    document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';
  });

// PEMICU IKLAN: 1X PAS PLAY PERTAMA
video.addEventListener("play", openAd);
</script>

</body>
</html>
